[workspace]
name = "metaphor-refantazio-headtracking"
version = "0.0.0"
description = "Head tracking mod for Metaphor: ReFantazio (OpenTrack, C++ ASI plugin)"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"
configure = "cmake -S . -B build -G \"Visual Studio 18 2026\" -A x64"
build = { cmd = "cmake --build build --config Release", depends-on = ["configure"] }
clean = "cmake -E rm -rf build build-tests release"
rebuild = { depends-on = ["clean", "build"] }

# The unit tests and the config differential test, in their own tree (build-tests/).
test = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-tests.ps1"
build-tests = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-tests.ps1 -BuildOnly"

# Rewrite config/CameraUnlock.ini, the committed copy of the CameraUnlock.ini the mod creates at
# first launch, from the config table after a change to a row, a comment or a default, then
# rewrite the per_game of launcher-manifest.json's config descriptor from it.
render-config = { cmd = "build-tests/Release/config_tests.exe --render-config config/CameraUnlock.ini && node cameraunlock-core/scripts/encode-seed.mjs", depends-on = ["build-tests"] }

# Checks the newest installer and Nexus ZIPs in release/ against core's manifest and config
# rules. Run it after package.
validate-manifest = "node cameraunlock-core/scripts/validate-manifest.mjs"

package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["build", "test"] }
deploy = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1", depends-on = ["build"] }

install = { cmd = "release/artifact-contents/install.cmd", depends-on = ["package"] }
uninstall = { cmd = "release/artifact-contents/uninstall.cmd", depends-on = ["package"] }

update-deps = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1"
release = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1"

[dependencies]
cmake = ">=3.28"
