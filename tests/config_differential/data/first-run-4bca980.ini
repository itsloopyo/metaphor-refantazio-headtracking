[General]
UdpPort=4242
EnableOnStartup=true
WorldSpaceYaw=true

[Sensitivity]
Yaw=1.0
Pitch=1.0
Roll=1.0
InvertYaw=false
InvertPitch=true
InvertRoll=false

[Smoothing]
; Applied when the tracker runs on this machine (loopback).
; 0 = no smoothing, 1 = heavy. Covers rotation and position.
LocalSmoothing=0.0
; Applied when the tracker is a remote device on the network.
; 0 = no smoothing, 1 = heavy. Covers rotation and position.
RemoteSmoothing=0.15

[Position]
SensitivityX=5.0
SensitivityY=5.0
SensitivityZ=5.0
InvertX=false
InvertY=false
InvertZ=true
